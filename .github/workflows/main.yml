name: Build Fabric Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'System_TriggerBot_AimAssist*GitHubActions*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          echo "Extracted: $ZIP"

      - name: Find Gradle project
        id: find-gradle
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found in ZIP."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties not found."
            find "$PROJECT_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Fabric Loom repository settings
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find-gradle.outputs.dir }}
        run: |
          set -e

          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          files = [
              root / "settings.gradle",
              root / "settings.gradle.kts",
          ]

          found = False

          for path in files:
              if not path.is_file():
                  continue

              text = path.read_text()
              updated = text.replace(
                  "RepositoriesMode.PREFER_SETTINGS",
                  "RepositoriesMode.PREFER_PROJECT"
              )
              updated = updated.replace(
                  "RepositoriesMode.FAIL_ON_PROJECT_REPOS",
                  "RepositoriesMode.PREFER_PROJECT"
              )

              if updated != text:
                  path.write_text(updated)
                  print("Updated:", path)
              else:
                  print("No matching repository mode in:", path)

              found = True

          if not found:
              raise SystemExit("settings.gradle(.kts) not found")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find-gradle.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          VERSION=$(sed -n \
            's/^distributionUrl=.*gradle-\([0-9.]*\)-bin.zip.*/\1/p' \
            gradle/wrapper/gradle-wrapper.properties)

          if [ -z "$VERSION" ]; then
            echo "::error::Cannot determine Gradle version."
            cat gradle/wrapper/gradle-wrapper.properties
            exit 1
          fi

          wget -q \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          unzip -oq /tmp/gradle.zip -d /tmp

          "/tmp/gradle-${VERSION}/bin/gradle" --no-daemon build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mod
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
