name: Build Fabric Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Gradle project
        id: find-gradle
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -not -path '*/.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found. Upload the complete Gradle project."
            echo "Files in repository:"
            ls -la
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.find-gradle.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Build mod
        working-directory: ${{ steps.find-gradle.outputs.dir }}
        run: ./gradlew --no-daemon build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mod
          path: ${{ steps.find-gradle.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
