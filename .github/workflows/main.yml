name: Build Fabric Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 4 -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "::error::Project ZIP not found. Upload the ZIP to the repository."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          echo "Extracted: $ZIP"

      - name: Find Gradle project
        id: find-gradle
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found in ZIP."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Fabric Loom repository settings
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find-gradle.outputs.dir }}
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          for name in ("settings.gradle", "settings.gradle.kts"):
              path = root / name
              if path.is_file():
                  text = path.read_text()
                  text = text.replace(
                      "RepositoriesMode.FAIL_ON_PROJECT_REPOS",
                      "RepositoriesMode.PREFER_PROJECT"
                  )
                  path.write_text(text)
                  print("Checked:", path)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find-gradle.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-aim
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
