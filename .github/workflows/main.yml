name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found in repository root"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          BUILD_FILE=$(find extracted -type f -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          rsync -a "$PROJECT_DIR"/ ./

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: edge-combat-toggle
          path: build/libs/*.jar
          if-no-files-found: error
